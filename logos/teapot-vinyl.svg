<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="DJ Teatime">
  <title>Teekanne als Schallplatte</title>
  <!-- Rillen und Mittelloch sind echte Aussparungen: der Untergrund scheint durch -->
  <mask id="tv-cut">
    <rect width="100" height="100" fill="#fff"/>
    <g fill="none" stroke="#000" stroke-width="1.7">
      <circle cx="50" cy="56" r="21"/>
      <circle cx="50" cy="56" r="16"/>
      <circle cx="50" cy="56" r="11"/>
    </g>
    <circle cx="50" cy="56" r="3" fill="#000"/>
  </mask>

  <g fill="currentColor" mask="url(#tv-cut)">
    <circle cx="50" cy="56" r="26"/>
  </g>

  <g fill="currentColor">
    <!-- Ausguss -->
    <path d="M29 43 C21 39 15 31 12 23 L22 26 C25 33 30 38 35 41 Z"/>
    <!-- Deckel und Knauf -->
    <path d="M37 32 Q50 21 63 32 Z"/>
    <circle cx="50" cy="24" r="3.5"/>
  </g>
  <!-- Henkel -->
  <path d="M75 44 C89 45 90 68 75 69" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
</svg>
