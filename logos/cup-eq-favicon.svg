<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="DJ Teatime">
  <title>Tasse mit Pegel, vereinfacht fuer kleine Groessen</title>
  <!-- Groebere Fassung nur fuer Favicon und Tab: dickere Balken, groessere
       Tasse, keine Untertasse. Feste Farbe statt currentColor, weil ein
       extern referenziertes SVG sonst schwarz rendert und im dunklen Tab
       verschwindet. Magenta liest sich auf hellem wie dunklem Grund. -->
  <g fill="#FF0090">
    <rect x="25" y="20" width="15" height="24" rx="7.5"/>
    <rect x="43" y="8"  width="15" height="36" rx="7.5"/>
    <rect x="61" y="26" width="15" height="18" rx="7.5"/>
    <path d="M18 52 H78 L71 86 C70 90.5 66 93 62 93 H34 C30 93 26 90.5 25 86 Z"/>
  </g>
  <path d="M80 60 C93 61 93 79 80 80" fill="none" stroke="#FF0090" stroke-width="9" stroke-linecap="round"/>
</svg>
