<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="DJ Teatime">
  <title>TT-Monogramm mit Mittelloch</title>
  <!-- Das Mittelloch macht das Monogramm zum Plattenlabel -->
  <mask id="tt-cut">
    <rect width="100" height="100" fill="#fff"/>
    <circle cx="50" cy="66" r="4.5" fill="#000"/>
  </mask>

  <g fill="currentColor" mask="url(#tt-cut)">
    <!-- durchgehender Querbalken beider T -->
    <rect x="11" y="23" width="78" height="12" rx="2"/>
    <rect x="26" y="23" width="12" height="54" rx="2"/>
    <rect x="62" y="23" width="12" height="54" rx="2"/>
  </g>
</svg>
