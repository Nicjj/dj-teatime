<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="DJ Teatime">
  <title>Schallplatte mit aufsteigendem Dampf</title>
  <mask id="rs-cut">
    <rect width="100" height="100" fill="#fff"/>
    <g fill="none" stroke="#000" stroke-width="2">
      <circle cx="50" cy="62" r="24"/>
      <circle cx="50" cy="62" r="17"/>
    </g>
    <circle cx="50" cy="62" r="3.4" fill="#000"/>
  </mask>

  <circle cx="50" cy="62" r="31" fill="currentColor" mask="url(#rs-cut)"/>

  <!-- Zwei Dampffahnen, gegenlaeufig geschwungen -->
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
    <path d="M41 26 C34 19 46 13 39 5"/>
    <path d="M60 26 C53 19 65 13 58 5"/>
  </g>
</svg>
