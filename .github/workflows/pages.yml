# Baut und veröffentlicht die Seite auf GitHub Pages.
#
# Alle fünf Minuten werden der Google-Kalender "Gigs" und Tims
# SoundCloud-Profil abgefragt. Nur wenn sich an den Terminen oder Releases
# etwas geändert hat, wird die Seite neu veröffentlicht. Neue Termine und
# Tracks sind so in der Regel nach wenigen Minuten auf der Seite. Bei
# Code-Änderungen (Push), von Hand und einmal täglich (frische Cover) wird
# immer veröffentlicht.
#
# Von Hand: github.com/Nicjj/dj-teatime -> Actions -> "Seite veröffentlichen"
#           -> "Run workflow". Das dauert etwa ein bis zwei Minuten.

name: Seite veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'   # Kalender und SoundCloud prüfen
    - cron: '42 3 * * *'    # einmal täglich neu veröffentlichen und den Zeitplan aktiv halten
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Läufe nicht gegenseitig abbrechen, sondern nacheinander abarbeiten
concurrency:
  group: pages
  cancel-in-progress: false

env:
  LIVE_BASIS: https://nicjj.github.io/dj-teatime/

jobs:
  pruefen:
    runs-on: ubuntu-latest
    outputs:
      geaendert: ${{ steps.vergleich.outputs.geaendert }}
    steps:
      - name: Code holen
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Ist Google oder SoundCloud kurz nicht erreichbar, wird diese Quelle
      # übersprungen und die Seite bleibt insoweit wie sie ist. Der Lauf gilt
      # trotzdem als erfolgreich, damit nicht alle fünf Minuten eine
      # Fehler-Mail von GitHub kommt.
      - name: Termine und Releases holen und mit der veröffentlichten Fassung vergleichen
        id: vergleich
        env:
          RELEASES_DATEI: pruefung-releases.json
        run: |
          node tools/termine.mjs || echo "::warning::Kalender gerade nicht abrufbar."
          node tools/releases.mjs --nur-liste || echo "::warning::SoundCloud gerade nicht abrufbar."
          node tools/vergleich.mjs

      # GitHub pausiert zeitgesteuerte Läufe, wenn im Repo 60 Tage lang
      # nichts passiert. Das erneute Aktivieren setzt diese Frist zurück.
      - name: Zeitplan aktiv halten
        if: github.event.schedule == '42 3 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"

  veroeffentlichen:
    needs: pruefen
    if: github.event_name != 'schedule' || github.event.schedule == '42 3 * * *' || needs.pruefen.outputs.geaendert == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Code holen
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Scheitert der Abruf hier, bricht der Lauf ab. Die zuletzt
      # veröffentlichte Fassung bleibt dann online.
      - name: Termine aus dem Google-Kalender holen
        run: node tools/termine.mjs

      # Releases und Cover liegen zusätzlich im Repo. Ist SoundCloud nicht
      # erreichbar, wird einfach diese gespeicherte Fassung veröffentlicht,
      # statt Code-Änderungen oder neue Termine aufzuhalten.
      - name: Releases und Cover von SoundCloud holen
        run: node tools/releases.mjs || echo "::warning::SoundCloud nicht abrufbar, die gespeicherten Releases werden veröffentlicht."

      # Termine und Releases fertig ins HTML schreiben: Google sieht sie ohne
      # JavaScript, und beim Laden springt nichts. Verändert index.html nur hier
      # im Runner, nicht im Repo.
      - name: Termine und Releases ins HTML schreiben
        run: node tools/vorrendern.mjs

      - name: Pages vorbereiten
        uses: actions/configure-pages@v6

      - name: Seite verpacken
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Veröffentlichen
        id: deploy
        uses: actions/deploy-pages@v5
