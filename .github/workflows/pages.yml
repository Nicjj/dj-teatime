# Baut und veröffentlicht die Seite auf GitHub Pages.
#
# Alle fünf Minuten wird der Google-Kalender "Gigs" abgefragt. Nur wenn
# sich an den Terminen etwas geändert hat, wird die Seite neu veröffentlicht.
# Neue, geänderte und gelöschte Termine sind so in der Regel nach wenigen
# Minuten auf der Seite. Bei Code-Änderungen (Push) und von Hand wird
# immer veröffentlicht.
#
# Von Hand: github.com/Nicjj/dj-teatime -> Actions -> "Seite veröffentlichen"
#           -> "Run workflow". Das dauert etwa ein bis zwei Minuten.

name: Seite veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'   # Kalender prüfen
    - cron: '42 3 * * *'    # einmal täglich zusätzlich den Zeitplan aktiv halten
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Läufe nicht gegenseitig abbrechen, sondern nacheinander abarbeiten
concurrency:
  group: pages
  cancel-in-progress: false

env:
  LIVE_URL: https://nicjj.github.io/dj-teatime/termine.json

jobs:
  pruefen:
    runs-on: ubuntu-latest
    outputs:
      geaendert: ${{ steps.vergleich.outputs.geaendert }}
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Ist Google kurz nicht erreichbar, bleibt die Seite einfach wie sie ist.
      # Der Lauf gilt trotzdem als erfolgreich, damit nicht alle fünf Minuten
      # eine Fehler-Mail von GitHub kommt.
      - name: Termine holen und mit der veröffentlichten Fassung vergleichen
        id: vergleich
        run: |
          if node tools/termine.mjs; then
            node tools/vergleich.mjs
          else
            echo "::warning::Kalender gerade nicht abrufbar, die Seite bleibt unverändert."
            echo "geaendert=false" >> "$GITHUB_OUTPUT"
          fi

      # GitHub pausiert zeitgesteuerte Läufe, wenn im Repo 60 Tage lang
      # nichts passiert. Das erneute Aktivieren setzt diese Frist zurück.
      - name: Zeitplan aktiv halten
        if: github.event.schedule == '42 3 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"

  veroeffentlichen:
    needs: pruefen
    if: github.event_name != 'schedule' || needs.pruefen.outputs.geaendert == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Scheitert der Abruf hier, bricht der Lauf ab. Die zuletzt
      # veröffentlichte Fassung bleibt dann online.
      - name: Termine aus dem Google-Kalender holen
        run: node tools/termine.mjs

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Seite verpacken
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Veröffentlichen
        id: deploy
        uses: actions/deploy-pages@v4
